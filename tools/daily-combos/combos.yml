# Daily Dream Team — card content.
# Edit this file to change what the cards show, then run:
#   python3 generate.py            (all days, JP + EN)
#   python3 generate.py 3          (Day 3 only)
#   python3 generate.py 3 --lang en
# Members use English villager names; portraits and JP/EN display names are
# resolved from the villagertier.com app data (villagers.json + public images).
# Tiers are the illustrative ratings shown on each card (S/A/B/C).

series:
  title:
    ja: "今日のドリームチーム"
    en: "Today's Dream Team"
  footer:
    ja: "あなたのドリームチームは？プロフィールのリンクから診断"
    en: "What's your dream team? Find yours — link in bio"

