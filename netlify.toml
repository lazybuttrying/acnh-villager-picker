# Netlify 배포 설정 — 모동숲 드림 주민 조합기 (정적 React/Vite SPA)
#
# ⚠️ netlify-plugin-a11y 는 추가하지 말 것.
#   v0.0.12는 pa11y 30s 타임아웃이 하드코딩(timeout 입력 미지원)이라,
#   단일 SPA 페이지가 헤드리스 Chrome에서 30s 내 로드 완료에 못 닿아 매 배포가 실패함.
#   접근성 검사가 필요하면 배포 파이프라인이 아니라 별도 CI(GitHub Actions)에서 돌릴 것.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 / TypeScript 6 호환 LTS 고정 (로컬 v25에 의존하지 않도록)
  NODE_VERSION = "22"

# 정규 도메인 통합: *.netlify.app 으로 들어온 요청을 커스텀 도메인으로 301.
# (순서 중요 — 아래 SPA 폴백보다 먼저 평가되어야 함. force=true로 파일 존재 여부 무관 적용)
[[redirects]]
  from = "https://acnh-villager-picker.netlify.app/*"
  to = "https://villagertier.com/:splat"
  status = 301
  force = true

# 해시 라우팅이라 실경로는 "/" 하나뿐이지만,
# 직접 진입/새로고침 시 SPA 폴백 안전망으로 둠.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
